# Install once with `pre-commit install`.
#
# These hooks are the cheap half of `make check` - the half fast enough to run
# on every commit. The suite and the web build stay in CI.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]

  # Secret scanning matters more here than in most repos: local configuration
  # follows a `.env.<integration>` pattern, so a new integration means a new
  # file whose name no existing ignore rule anticipated. `.gitignore` covers
  # `.env.*` today, and this is the check for the day someone adds
  # `tooluniverse.env` or `secrets.local.yaml` instead.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # Drone and Nomad manifests are the files most likely to be edited by
        # hand and least likely to be exercised before a deploy.
        files: ^(\.drone\.yml|compose\.yaml)$
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
