name: pdis

services:
  api:
    container_name: pdis-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    container_name: pdis-web
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_PDIS_API_URL: http://localhost:8000
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
