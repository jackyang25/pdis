# PDIS production stack.
# Create once with Render Dashboard -> New -> Blueprint, then manage by sync.
previews:
  generation: "off"

projects:
  - name: PDIS
    environments:
      - name: Production
        services:
          # Public FastAPI gateway. Docker supplies LibreOffice for document
          # visual conversion; Starter avoids cold starts during long analyses.
          - type: web
            name: pdis-api
            runtime: docker
            plan: starter
            region: ohio
            dockerfilePath: ./Dockerfile
            healthCheckPath: /api/health
            envVars:
              - key: OPENAI_API_KEY
                sync: false
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: ANTHROPIC_QUANTITATIVE_MODEL
                value: claude-opus-5
              - key: NCBI_API_KEY
                sync: false
              - key: CORS_ALLOW_HOSTS
                fromService:
                  name: pdis-web
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: TOOLUNIVERSE_HOST
                fromService:
                  name: pdis-tooluniverse
                  type: pserv
                  property: host
              - key: TOOLUNIVERSE_PORT
                fromService:
                  name: pdis-tooluniverse
                  type: pserv
                  property: port
              - key: TOOLUNIVERSE_API_TOKEN
                fromService:
                  name: pdis-tooluniverse
                  type: pserv
                  envVarKey: TOOLUNIVERSE_API_TOKEN
              - key: TOOLUNIVERSE_TIMEOUT_SECONDS
                value: 30

          # Public Next.js client. It is stateless and can tolerate free-tier
          # idle spin-down without interrupting an API analysis already running.
          - type: web
            name: pdis-web
            runtime: node
            plan: free
            region: ohio
            rootDir: web
            buildCommand: npm ci && npm run build
            startCommand: node .next/standalone/server.js
            healthCheckPath: /
            envVars:
              - key: HOSTNAME
                value: 0.0.0.0
              - key: NEXT_PUBLIC_PDIS_API_HOST
                fromService:
                  name: pdis-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

          # Private ToolUniverse connector. Its generated bearer token and
          # private address are injected into the API above.
          - type: pserv
            name: pdis-tooluniverse
            runtime: docker
            plan: starter
            region: ohio
            dockerfilePath: ./deploy/tooluniverse/Dockerfile
            dockerContext: ./deploy/tooluniverse
            envVars:
              - key: PORT
                value: 8080
              - key: TOOLUNIVERSE_API_TOKEN
                generateValue: true
              - key: SEMANTIC_SCHOLAR_API_KEY
                sync: false
