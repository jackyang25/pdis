# PDIS production stack.
# Create once with Render Dashboard -> New -> Blueprint, then manage by sync.
previews:
  generation: "off"

projects:
  - name: PDIS
    environments:
      - name: Production
        services:
          # Public FastAPI gateway. Docker supplies LibreOffice for document
          # visual conversion, and the plan avoids cold starts during long
          # analyses.
          #
          # Standard, not Starter: grading sends one request per rubric variable
          # rather than batching seven, so a 26-variable rubric issues ~90 model
          # calls with up to 24 in flight (MAX_PARALLEL_SECTIONS x
          # MAX_PARALLEL_DIMENSION_BATCHES). Each holds a request and a response,
          # alongside the parsed document and a LibreOffice process. That peaked
          # at 512 MB and was killed. Starter's 0.5 CPU also saturated.
          #
          # One measured run peaks near 530 MB, so MAX_CONCURRENT_RUNS keeps two
          # in flight (~1.1 GB over an 80 MB baseline) and queues the rest. The
          # plan and the cap are one decision: raising the plan without raising
          # the cap wastes memory, and the reverse exceeds the instance.
          - type: web
            name: pdis-api
            runtime: docker
            plan: standard
            region: ohio
            dockerfilePath: ./Dockerfile
            healthCheckPath: /api/health
            envVars:
              - key: MAX_CONCURRENT_RUNS
                value: 2
              - key: OPENAI_API_KEY
                sync: false
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: ANTHROPIC_QUANTITATIVE_MODEL
                value: claude-opus-5
              - key: NCBI_API_KEY
                sync: false
              - key: CORS_ALLOW_HOSTS
                fromService:
                  name: pdis-web
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: TOOLUNIVERSE_HOST
                fromService:
                  name: pdis-tooluniverse
                  type: pserv
                  property: host
              - key: TOOLUNIVERSE_PORT
                fromService:
                  name: pdis-tooluniverse
                  type: pserv
                  property: port
              - key: TOOLUNIVERSE_API_TOKEN
                fromService:
                  name: pdis-tooluniverse
                  type: pserv
                  envVarKey: TOOLUNIVERSE_API_TOKEN
              - key: TOOLUNIVERSE_TIMEOUT_SECONDS
                value: 30
              # Tavily. `sync: false` so the key is set in the dashboard and never
              # committed. The lane disables itself when this is absent, so a deploy without
              # it behaves exactly as it did before Tavily existed.
              - key: TAVILY_API_KEY
                sync: false
              # `advanced` costs two credits and `basic` one. Advanced by default because the
              # reason to run this lane is the quality of the extracted page text. Set this to
              # `basic` to halve the cost of a comparison run.
              - key: TAVILY_SEARCH_DEPTH
                value: advanced
              - key: TAVILY_TIMEOUT_SECONDS
                value: 30

          # Public Next.js client. It is stateless and can tolerate free-tier
          # idle spin-down without interrupting an API analysis already running.
          - type: web
            name: pdis-web
            runtime: docker
            plan: free
            region: ohio
            dockerfilePath: ./web/Dockerfile
            dockerContext: .
            healthCheckPath: /
            envVars:
              - key: HOSTNAME
                value: 0.0.0.0
              - key: NEXT_PUBLIC_PDIS_API_HOST
                fromService:
                  name: pdis-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

          # Private ToolUniverse connector. Its generated bearer token and
          # private address are injected into the API above.
          #
          # Standard, not Starter: retrieval fans out to
          # searcher's global_worker_limit (48) concurrent calls per run, and the
          # API admits MAX_CONCURRENT_RUNS at once, so this single-worker process
          # can hold ~96 requests and their responses. That exceeded 512 MB and
          # was killed. Raising the API's cap raises this ceiling too.
          - type: pserv
            name: pdis-tooluniverse
            runtime: docker
            plan: standard
            region: ohio
            dockerfilePath: ./deploy/tooluniverse/Dockerfile
            dockerContext: ./deploy/tooluniverse
            envVars:
              - key: PORT
                value: 8080
              - key: TOOLUNIVERSE_API_TOKEN
                generateValue: true
              - key: SEMANTIC_SCHOLAR_API_KEY
                sync: false
