# Aligner's whole configuration: the documents it may be handed, and which pairs
# of them form a comparison.
#
# Nothing in the pipeline knows how many documents a run has or which types are
# comparable. Both facts live here, which is what makes adding a document type a
# config edit rather than a change to `run_pipeline`, the API route, the upload
# form, and the result schema.

# How each source type is described. `default` is required: a source type the
# chunker can parse is usable the moment it exists, and naming it below only
# makes the description specific.
document_roles:
  itpp: Early, candidate-agnostic intervention target profile stating what the Foundation wants.
  ctpp: Candidate-specific target product profile describing what a grantee is developing.
  ipdp: Integrated product development plan describing execution and decision pathways.
  default: Product-development document.

# Which ordered pairs form a comparison, and what each one asks.
#
# `reference` is the document being honoured; `comparison` is the one measured
# against it. The direction is the whole point - it is not a symmetric diff.
#
# A run compares every declared pair whose documents were both supplied, so two
# documents produce one comparison and three produce two. There is deliberately
# no itpp/ipdp pair: a plan is written against the candidate, not against the
# Foundation's abstract goal, so that comparison reports differences the cTPP
# pair already explains.
#
# The two entries below ask structurally different questions - one asks whether a
# candidate clears a bar, the other whether a plan delivers a commitment. Nothing
# in code distinguishes them today. When an analysis needs to, that distinction
# becomes a field here rather than a branch in a stage.
edges:
  - reference: itpp
    comparison: ctpp
    question: Does the candidate meet the bar the intervention profile sets?
  - reference: ctpp
    comparison: ipdp
    question: Does the plan deliver what the candidate profile commits to?
