# Who every draft is for. Read by every stage that asks a model: searches look for this
# setting, readings keep where each source applies, and suggestions aim at it.
programme_context: |
  BMGF intervention TPPs describe products for low- and middle-income countries. A target
  serves public-sector programmes there: testing at or near the point of care, procurement by
  national programmes and global funders, WHO prequalification, and use where laboratory
  infrastructure, power, trained staff and budgets are limited.
query_guidance: |
  Search for what existing tests for this indication achieved on this variable -
  diagnostic accuracy studies, evaluations, labels and regulatory reviews - and for what
  published target profiles ask of a new test (WHO target product profiles, WHO
  prequalification requirements, FIND and Unitaid landscapes). Prefer named tests and
  named authorities over generic phrasing.
