programme_context: |
  BMGF intervention TPPs describe products for low- and middle-income countries. A target
  serves public-sector programmes there: national treatment guidelines and essential-medicines
  lists, procurement by national programmes and global funders, WHO prequalification, and
  delivery through primary and community care where laboratory capacity and budgets are
  limited.
query_guidance: |
  Search for what approved and late-stage drugs for this indication achieved on this
  variable - trial results, labels and regulatory reviews - and for what published target
  profiles and treatment guidelines ask of a new drug (WHO target product profiles, WHO
  treatment guidelines, essential-medicines listings). Prefer named products and named
  authorities over generic phrasing.
