# Decision to File — the stage-gate question bank, transcribed.
#
# Transcribed by hand from the source named in `mirrors`, not parsed from it.
# That document is what this file was checked against; this file is the source
# everything downstream reads.
#
# The source guarantees three axes and this file carries exactly those three: the
# gate, the owning discipline, and whether the gate requires a question answered
# now (`required`) or expects it to be forming (`anticipatory`). Nothing else is
# transcribed and nothing is inferred — an earlier bank carried a hint about which
# document usually answers a question, which no source states, and it was removed.
#
# `intervention_classes` is a fact about the whole document rather than about any
# question: it derives from a drug milestone dictionary and asks about synthetic
# routes, salt and polymorph selection and BCS class, so a vaccine or a mAb has no
# answer to give. A run for another class is refused rather than returned with every
# question inapplicable, because a review of nothing reads like a review that found
# nothing wrong.

org: bmgf
gate:
  id: dtf
  label: Decision to File
  ordinal: 6

intervention_classes: [drug]

mirrors: >-
  Stage Gate Questions - All Gates.docx, developed from the Drug Development Milestone
  Dictionary (PDID). LCS questions reviewed by the Certara team, 7/13.

disciplines:
  - id: pds
    label: Product Development Strategy
    questions:
      - id: PDS.DTF.1
        requirement: required
        text: >-
          Is the delivery plan complete with operational launch and post-launch plans (roll-
          out, country decision support, supply chain, provider training, government
          partnerships)?

      - id: PDS.DTF.2
        requirement: required
        text: >-
          Does the final strategic demand forecast confirm a viable market and support pricing
          agreements (refined countries/populations/coverage/volumes/pricing/sensitivity)?

      - id: PDS.DTF.3
        requirement: required
        text: >-
          Is the final COGS in line with launch and pricing goals, with expected price aligned
          to the TPP and BMGF strategy?

      - id: PDS.DTF.4
        requirement: required
        text: >-
          Are policymakers supportive of the final cost-effectiveness analysis?

      - id: PDS.DTF.5
        requirement: required
        text: >-
          Is pricing, supply, and financing secured for launch?

      - id: PDS.DTF.6
        requirement: required
        text: >-
          Is the updated candidate TPP complete (indication, impact, manufacturability,
          formulation/dosing/stability, route, shelf-life, cost & delivery, registration
          strategy, partner alignment)?

      - id: PDS.DTF.7
        requirement: required
        text: >-
          Is the refined launch budget a detailed, accurate estimate of launch support and
          uptake costs?

      - id: PDS.DTF.8
        requirement: required
        text: >-
          Is the Coverage & Financial Tracker established with target metrics (countries
          launched, coverage, average procurement price, incremental cost to deliver)?

      - id: PDS.DTF.9
        requirement: required
        text: >-
          Is a viable delivery partnership assembled, and is the Global Access Agreement
          updated?

      - id: PDS.DTF.10
        requirement: required
        text: >-
          Do country implementation plans address all risks and stakeholders (MoHs, health
          workers, suppliers), and are coverage/pricing metrics set (M&E)?

  - id: cmc
    label: Chemistry, Manufacturing and Controls (CMC)
    questions:
      - id: CMC.DTF.1
        requirement: required
        text: >-
          Is the commercial launch strategy in place for each country market, with a product
          expiry-date proposal/strategy for regulatory submission?

      - id: CMC.DTF.2
        requirement: required
        text: >-
          Is the finished-product warehouse qualified and operational, and is shipping
          validation complete?

      - id: CMC.DTF.3
        requirement: required
        text: >-
          Are QA/compliance activities complete - product registration, facility audit
          reports, audit-observation compliance (CAPA), and a pre-approval inspection strategy
          with clear partner/CRO/CMO roles?

      - id: CMC.DTF.4
        requirement: required
        text: >-
          If the clinical-development form and commercial form differ, has bioequivalence been
          established?

      - id: CMC.DTF.5
        requirement: required
        text: >-
          Is an ongoing-CMC-support plan in place - CMO supply-chain monitoring, quality-
          incident review, deviation/excursion evaluation, raw-material change control, and
          commercial-stability monitoring?

      - id: CMC.DTF.6
        requirement: required
        text: >-
          Does the plan cover timely periodic regulatory reporting and the impact of demand-
          forecast changes on the need for additional sites or suppliers?

      - id: CMC.DTF.7
        requirement: required
        text: >-
          Is tech transfer and validation of raw-material/DS/DP analytical and functional
          release testing complete, with validation packages (specificity, sensitivity,
          reproducibility)?

      - id: CMC.DTF.8
        requirement: required
        text: >-
          Is tech transfer and validation of DS/DP manufacturing and packaging complete - SOP-
          driven protocols, a control strategy for ongoing production, and three validation
          batches on stability?

      - id: CMC.DTF.9
        requirement: required
        text: >-
          Are commercial-scale facilities qualified - site master plan, cGMP certification,
          FDA/NRA and client audits, change-control strategy, and an inspection-response
          action plan?

      - id: CMC.DTF.10
        requirement: required
        text: >-
          Is required documentation final - ongoing stability program/reports, process
          qualification reports, master batch record, vendor qualification, commercial SOPs,
          container/labeling/shipping stability studies - and is the CMC plan finalized with
          PQ/LR activities and risks?

  - id: cp
    label: Clinical Pharmacology
    questions:
      - id: CP.DTF.1
        requirement: required
        text: >-
          Are drug-drug interactions fully characterized for the filing?

      - id: CP.DTF.2
        requirement: required
        text: >-
          Does the candidate's safety profile (including labs) align with the TPP from the
          pivotal-trial analysis?

      - id: CP.DTF.3
        requirement: required
        text: >-
          Is the final dose/regimen supported by the totality of exposure-response and
          population-PK evidence?

      - id: CP.DTF.4
        requirement: required
        text: >-
          Is the drug-interaction profile prepared for the NRA filing package and proposed
          label?

      - id: CP.DTF.5
        requirement: required
        text: >-
          Are special-population data (renal/hepatic, pediatric, pregnancy, age/weight)
          adequate to support labeling?

      - id: CP.DTF.6
        requirement: required
        text: >-
          Are clinical PK and exposure-response summaries (clinical study reports / data
          listings) complete for submission?

      - id: CP.DTF.7
        requirement: required
        text: >-
          Is the proposed dosing for the target population (incl. weight-band / fixed dosing)
          justified for field use?

      - id: CP.DTF.8
        requirement: required
        text: >-
          Are pediatric and post-marketing (Phase 4) PK commitments defined?

      - id: CP.DTF.9
        requirement: required
        text: >-
          Is bioequivalence between clinical and commercial forms established where they
          differ (to support the marketed dose)?

      - id: CP.DTF.10
        requirement: required
        text: >-
          Are unresolved clin-pharm questions (e.g., DDIs needing post-approval study)
          identified with a plan for agency interactions?

  - id: ns
    label: Nonclinical Safety
    questions:
      - id: NS.DTF.1
        requirement: required
        text: >-
          Is the full nonclinical toxicology package complete for filing - chronic toxicity,
          carcinogenicity, and reproductive/developmental toxicology (as applicable)?

      - id: NS.DTF.2
        requirement: required
        text: >-
          Are metabolite safety assessments (active / major metabolites) complete and
          reconciled with human metabolism?

      - id: NS.DTF.3
        requirement: required
        text: >-
          Do the nonclinical safety summaries for the filing reconcile with the clinical
          safety profile?

      - id: NS.DTF.4
        requirement: required
        text: >-
          Are nonclinical safety margins for the to-be-marketed dose adequate and clearly
          documented for the submission?

      - id: NS.DTF.5
        requirement: required
        text: >-
          Have all genotoxicity, safety pharmacology, and toxicokinetic conclusions been
          finalized for the dossier?

      - id: NS.DTF.6
        requirement: required
        text: >-
          Is impurity qualification (including absence of genotoxic impurities) supported by
          toxicology where needed?

      - id: NS.DTF.7
        requirement: required
        text: >-
          Are juvenile-animal / pediatric nonclinical studies addressed if a pediatric
          indication or population is intended?

      - id: NS.DTF.8
        requirement: required
        text: >-
          Are any outstanding or post-approval nonclinical commitments identified with a plan?

      - id: NS.DTF.9
        requirement: required
        text: >-
          Is the nonclinical contribution to benefit-risk and labeling (pregnancy,
          carcinogenicity statements) finalized?

      - id: NS.DTF.10
        requirement: required
        text: >-
          Is the Investigator's Brochure / safety documentation final and consistent with the
          dossier?

  - id: ra
    label: Regulatory
    questions:
      - id: RA.DTF.1
        requirement: required
        text: >-
          Is the regulatory strategy and plan finalized for filing, reflecting the complete
          data package?

      - id: RA.DTF.2
        requirement: required
        text: >-
          Is a pre-licensure meeting in the country of manufacture scheduled, with its
          briefing package prepared?

      - id: RA.DTF.3
        requirement: required
        text: >-
          Does the package present safety and efficacy data from all clinical trials and
          product release specifications (incl. pre-approval inspection)?

      - id: RA.DTF.4
        requirement: required
        text: >-
          Are stability data supporting expiration dating and the proposed claims/indication
          label statements included?

      - id: RA.DTF.5
        requirement: required
        text: >-
          Is there agreement (or a request) on deferral/waiver of pediatric studies, where
          applicable?

      - id: RA.DTF.6
        requirement: required
        text: >-
          Are plans for post-approval clinical studies and the pharmacovigilance plan defined?

      - id: RA.DTF.7
        requirement: required
        text: >-
          Is the clinical-to-commercial manufacturing transition and comparability addressed
          for the filing?

      - id: RA.DTF.8
        requirement: required
        text: >-
          Are application content/format (paper vs. electronic) and submission type planned,
          and is the need for an advisory committee determined?

      - id: RA.DTF.9
        requirement: required
        text: >-
          Is the schedule/route of communications with the NRA during review agreed?

      - id: RA.DTF.10
        requirement: required
        text: >-
          Have pre-licensure meeting outcomes been documented and an action plan set to
          resolve issues before filing?
