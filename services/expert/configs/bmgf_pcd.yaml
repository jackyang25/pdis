# Preclinical Candidate Development — the stage-gate question bank, transcribed.
#
# Transcribed by hand from the source named in `mirrors`, not parsed from it.
# That document is what this file was checked against; this file is the source
# everything downstream reads.
#
# The source guarantees three axes and this file carries exactly those three: the
# gate, the owning discipline, and whether the gate requires a question answered
# now (`required`) or expects it to be forming (`anticipatory`). Nothing else is
# transcribed and nothing is inferred — an earlier bank carried a hint about which
# document usually answers a question, which no source states, and it was removed.
#
# `intervention_classes` is a fact about the whole document rather than about any
# question: it derives from a drug milestone dictionary and asks about synthetic
# routes, salt and polymorph selection and BCS class, so a vaccine or a mAb has no
# answer to give. A run for another class is refused rather than returned with every
# question inapplicable, because a review of nothing reads like a review that found
# nothing wrong.

org: bmgf
gate:
  id: pcd
  label: Preclinical Candidate Development
  ordinal: 2

intervention_classes: [drug]

mirrors: >-
  Stage Gate Questions - All Gates.docx, developed from the Drug Development Milestone
  Dictionary (PDID). LCS questions reviewed by the Certara team, 7/13.

disciplines:
  - id: pds
    label: Product Development Strategy
    questions:
      - id: PDS.PCD.1
        requirement: required
        text: >-
          Does the candidate molecule align with the Foundation (intervention) target product
          profile?

      - id: PDS.PCD.2
        requirement: required
        text: >-
          Does the candidate offer feasibility and benefit over existing treatments?

      - id: PDS.PCD.3
        requirement: required
        text: >-
          Have combination needs been assessed (need for combination, assessment strategy)
          given the therapeutic strategy?

      - id: PDS.PCD.4
        requirement: required
        text: >-
          Can the cTPP and iTPP be compared side by side to confirm strategic fit?

      - id: PDS.PCD.5
        requirement: anticipatory
        text: >-
          Is a business case taking shape - value proposition vs. the disease strategy and
          other interventions?

      - id: PDS.PCD.6
        requirement: anticipatory
        text: >-
          Is an aspirational / affordable cost target being framed to guide development?

      - id: PDS.PCD.7
        requirement: anticipatory
        text: >-
          Is the target market and population understanding being developed (size, segments,
          user needs)?

      - id: PDS.PCD.8
        requirement: anticipatory
        text: >-
          Is the global-access intent (affordable price, supply for developing countries)
          being built into plans?

      - id: PDS.PCD.9
        requirement: anticipatory
        text: >-
          Are deliverability risks (supply chain, delivery mode, provider/user issues) being
          scoped?

      - id: PDS.PCD.10
        requirement: anticipatory
        text: >-
          Are strategic / portfolio risks and partner alignment captured in the candidate-
          selection package?

  - id: cmc
    label: Chemistry, Manufacturing and Controls (CMC)
    questions:
      - id: CMC.PCD.1
        requirement: required
        text: >-
          Is initial drug-substance characterization complete - chirality/enantiomer
          interconversion, solubility (pKa, LogP/LogD), Caco-2 permeability, and BCS
          classification - and do results confirm developability?

      - id: CMC.PCD.2
        requirement: required
        text: >-
          Have thermal analysis/DSC and salt & form screening (amorphous vs. crystalline,
          polymorph ID) been completed, and has a stable, bioavailable salt/form been
          selected?

      - id: CMC.PCD.3
        requirement: required
        text: >-
          Do DS and preliminary DP stability studies - solid-state, plus T/pH/humidity/light
          and metabolic stability - support the intended formulation and storage conditions?

      - id: CMC.PCD.4
        requirement: required
        text: >-
          Is chemical purity established with identified impurity profiles, and are the
          supporting analytical methods developed and fit for the planned studies?

      - id: CMC.PCD.5
        requirement: required
        text: >-
          Has a preliminary DS formulation been developed and bioavailability/PK confirmed in
          animals for the intended route (oral/IP/IV/SC) and the planned tox and PoC studies?

      - id: CMC.PCD.6
        requirement: required
        text: >-
          Have particle-size/oral-bioavailability needs been assessed (including any milling
          or micronization), and are GLP analytical methods for formulation stability and
          release in place?

      - id: CMC.PCD.7
        requirement: required
        text: >-
          Are active comparators (known benchmarks) characterized and formulated consistently
          to support the preclinical program?

      - id: CMC.PCD.8
        requirement: required
        text: >-
          Is the CMC development plan in place, listing the activities to reach Initial DS/DP
          characterization at FIH - cGMP process definition, kilo-scale DS, analytical method
          development, and Phase 1 GMP supply?

      - id: CMC.PCD.9
        requirement: required
        text: >-
          Does the plan identify CMC development risks to PQ with mitigation strategies for
          timeline, cost, and resources, and is an IPDP (plan to FIH in detail, to approval at
          high level) available?

      - id: CMC.PCD.10
        requirement: required
        text: >-
          Have CMOs/CROs for DS/DP manufacturing and analytical services been selected and
          qualified - cGMP certification, audits, capability/capacity, preliminary cost, lead
          times, and contract terms?

  - id: cp
    label: Clinical Pharmacology
    questions:
      - id: CP.PCD.1
        requirement: required
        text: >-
          Are in vitro / in silico / in vivo dose-response relationships established for the
          candidate?

      - id: CP.PCD.2
        requirement: required
        text: >-
          Are PK and ADME properties optimized, and does modeling indicate the candidate is
          likely to achieve the TPP's human PK goals?

      - id: CP.PCD.3
        requirement: required
        text: >-
          Is a PK-PD relationship established using an animal disease model (preferred) or
          alternate functional assay?

      - id: CP.PCD.4
        requirement: required
        text: >-
          Is a target-engagement biomarker identified to support translational dose
          projection?

      - id: CP.PCD.5
        requirement: required
        text: >-
          Has safety pharmacology been characterized (and reactive-metabolite formation
          assessed) to define preliminary safety margins?

      - id: CP.PCD.6
        requirement: required
        text: >-
          Is off-target screening in place with adequate selectivity achieved?

      - id: CP.PCD.7
        requirement: required
        text: >-
          Does the candidate-selection justification package include a quantitative human
          dose/exposure projection?

      - id: CP.PCD.8
        requirement: anticipatory
        text: >-
          Are species-appropriate bioanalytical methods qualified for animal application and
          translatable to human?

      - id: CP.PCD.9
        requirement: anticipatory
        text: >-
          Has a translational modeling strategy (allometry/PBPK or similar) been chosen to
          predict the FIH starting dose?

      - id: CP.PCD.10
        requirement: anticipatory
        text: >-
          Are predicted human DDI and special-population liabilities flagged for IND-enabling
          follow-up?

  - id: ns
    label: Nonclinical Safety
    questions:
      - id: NS.PCD.1
        requirement: required
        text: >-
          Have preliminary in vitro / in vivo safety and toxicology studies been completed
          (safety pharmacology, acute toxicology)?

      - id: NS.PCD.2
        requirement: required
        text: >-
          Has genotoxicity been assessed in preliminary screens (e.g., Ames, in vitro
          micronucleus)?

      - id: NS.PCD.3
        requirement: required
        text: >-
          Has cytotoxicity been characterized for the candidate?

      - id: NS.PCD.4
        requirement: required
        text: >-
          Has reactive-metabolite formation been evaluated?

      - id: NS.PCD.5
        requirement: required
        text: >-
          Is safety pharmacology (core battery: CV/hERG, CNS, respiratory) initiated to
          characterize functional risks?

      - id: NS.PCD.6
        requirement: required
        text: >-
          Is off-target screening in place with adequate selectivity to limit secondary-
          pharmacology toxicity?

      - id: NS.PCD.7
        requirement: required
        text: >-
          Does the candidate-selection justification package include a preliminary safety
          assessment / therapeutic-window estimate?

      - id: NS.PCD.8
        requirement: anticipatory
        text: >-
          Is a GLP toxicology strategy (species selection, study designs) defined to support
          the planned IND-enabling program?

      - id: NS.PCD.9
        requirement: anticipatory
        text: >-
          Have the toxicokinetic / bioanalytical approaches needed to interpret tox studies
          been planned?

      - id: NS.PCD.10
        requirement: anticipatory
        text: >-
          Are anticipated long-term, reproductive, or carcinogenicity liabilities flagged for
          the development plan?

  - id: ra
    label: Regulatory
    questions:
      - id: RA.PCD.1
        requirement: anticipatory
        text: >-
          Is a regulatory strategy being initiated, defining the proposed pathway and likely
          first NRA(s)?

      - id: RA.PCD.2
        requirement: anticipatory
        text: >-
          Are country-specific regulatory requirements for priority markets being identified
          (e.g., China/India content early)?

      - id: RA.PCD.3
        requirement: anticipatory
        text: >-
          Is a pre-IND (or NRA-equivalent) meeting strategy being planned, including the
          questions to pose to the agency?

      - id: RA.PCD.4
        requirement: anticipatory
        text: >-
          Are the drug-characterization data for the pre-IND/IND package (molecular/physchem,
          purity, stability, formulation concept) being assembled?

      - id: RA.PCD.5
        requirement: anticipatory
        text: >-
          Is the nonclinical data package (PK/PD/ADME, efficacy, safety) being structured to
          support the IND submission?

      - id: RA.PCD.6
        requirement: anticipatory
        text: >-
          Is the planned regulatory pathway (standard vs.
          accelerated/conditional/breakthrough) appropriate for the indication and evidence?

      - id: RA.PCD.7
        requirement: anticipatory
        text: >-
          Are WHO PQ applicability and the engagement timeline (by end of Phase 2) being
          scoped?

      - id: RA.PCD.8
        requirement: anticipatory
        text: >-
          Is the ethics-committee / IRB review process and its interplay with the IND
          understood for trial countries?

      - id: RA.PCD.9
        requirement: anticipatory
        text: >-
          Are key regulatory risks and mitigations being identified as the candidate is
          selected?

      - id: RA.PCD.10
        requirement: anticipatory
        text: >-
          Does the candidate-selection package consider regulatory feasibility (approvability,
          labeling, market access)?
