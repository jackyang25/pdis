# InspectionConfig template.
#
# Copy this file to a new config (e.g., new_product_type.yaml) and fill in the
# sections and units of the rubric you want to assess against.
#
# A section and a variable declare the same four things, so there is one schema to
# learn rather than two. A section adds only its `variables` list.
#
# Every rubric unit is assessed by one model call and gets exactly one verdict, with
# one statement saying what is wrong and the exact blocks it was read from. The
# verdicts are: specified, not present, placeholder, insufficient, vague, and not
# applicable. There is no letter grade, no score, no severity scale
# and no section weight: units are ordered by verdict, worst first, and then by the
# order you write the rubric in - so the sequence below is itself the statement of
# what matters most.

type_key: example_org_itpp_vaccine
org: example_org
source_type: itpp
intervention_class: vaccine
display_name: "Template Rubric"

# Optional document-stage calibration, injected into every assessment prompt (for
# example, an ITPP expects less numeric specificity than a CTPP).
stage_guidance: |
  Replace with concise stage-specific guidance.

# The chunker config used for parsing/labeling is resolved automatically from
# (org, source_type, intervention_class) — the same triple as this file.

sections:
  # A section with no variables is itself one unit, assessed as prose.
  - name: "Introduction"
    description: "Background or framing for this document type. What should be present here, and what makes it complete?"

  - name: "Section Name (with structured variables)"
    description: "Describe what to look for. List discrete variables below so each becomes its own unit."
    variables:
      - name: "Variable Name"
        description: "What this unit should contain."
        # What good looks like, read into the prompt verbatim. This is where an
        # external standard belongs when one applies (ICH, WHO PQ, a house style):
        # as the expectation a unit is held to, never as a second rubric.
        expectations: "A point estimate or range with units, and the source behind it."

      - name: "Another Variable"
        description: "Quantitative target, source citation, both Minimum and Optimistic columns filled — whatever the rubric expects."
        # Absence here is reported as not applicable rather than a shortfall. Set
        # this only where the rubric genuinely does not require the unit; it is the
        # rubric author's decision and the model is never allowed to make it.
        optional: true

  - name: "Optional Section"
    description: "A whole section may be optional, which applies to every unit in it."
    optional: true
    expectations: "Applies to each of this section's units unless the unit overrides it."
