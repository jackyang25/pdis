fact_definitions:
  - key: small_molecule
    label: Small-molecule product
    description: Is the candidate a small-molecule product?
  - key: systemic_exposure
    label: Systemic exposure
    description: Is systemic exposure expected at the proposed clinical use?
  - key: antiarrhythmic
    label: Antiarrhythmic purpose
    description: Is the product intended as an antiarrhythmic?
  - key: public_sector_vaccine
    label: Public-sector immunization
    description: Is the vaccine intended for public-sector immunization programmes in low- or middle-income countries?
  - key: infectious_disease_vaccine
    label: Infectious-disease vaccine
    description: Does the vaccine induce an immune response against an infectious agent or its toxins to prevent or treat disease?
  - key: who_prequalification_ivd
    label: WHO prequalification for an IVD
    description: Is the product an in vitro diagnostic eligible for WHO prequalification, with that pathway intended? Choose Not known if eligibility or the pathway is unresolved.
  - key: binary_diagnostic_result
    label: Positive or negative diagnostic result
    description: Does the diagnostic claim classify a target condition as present or absent, even if the underlying measurement is quantitative?

