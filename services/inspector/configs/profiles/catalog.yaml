fact_definitions:
  - key: small_molecule
    label: Small-molecule product
    description: Is the candidate a small-molecule product?
  - key: systemic_exposure
    label: Systemic exposure
    description: Is systemic exposure expected at the proposed clinical use?
  - key: antiarrhythmic
    label: Antiarrhythmic purpose
    description: Is the product intended as an antiarrhythmic?

profiles:
  - &itpp_drug
    org: bmgf
    source_type: itpp
    intervention_class: drug
    document_config: rubrics/pdid/pdid-itpp-drug.yaml
    rubrics:
      - {id: bmgf, revision: "1.0", definition: pdid/pdid.yaml}
      - {id: ich-e4-itpp, revision: "1.0", definition: ich/ich-e4-itpp.yaml}
      - {id: ich-q8-itpp, revision: "1.0", definition: ich/ich-q8-itpp.yaml}
  - <<: *itpp_drug
    source_type: ctpp
    document_config: rubrics/pdid/pdid-ctpp-drug.yaml
    rubrics:
      - {id: bmgf, revision: "1.0", definition: pdid/pdid.yaml}
      - {id: ich-e4-ctpp, revision: "1.0", definition: ich/ich-e4-ctpp.yaml}
      - id: ich-e14-ctpp
        revision: "1.0"
        definition: ich/ich-e14-ctpp.yaml
        applicability: {small_molecule: ["yes"], systemic_exposure: ["yes"], antiarrhythmic: ["no"]}
      - {id: ich-e9-ctpp, revision: "1.0", definition: ich/ich-e9-ctpp.yaml}
      - {id: ich-e10-ctpp, revision: "1.0", definition: ich/ich-e10-ctpp.yaml}
