id: ich-e10-ctpp
revision: "1.0"
updated_on: "2026-09-11"
display_name: "ICH E10: comparison rationale"
authority: "PDIS-authored adaptation informed by ICH E10; source copyright ICH, no ICH endorsement"
scope: "Selected candidate-level clinical comparison expectations; not an evaluation of external comparative evidence."
evidence_scope: whole_document
sources:
  - {id: "ich-e10-1-1", title: "ICH E10 — Section 1.1: General scheme and purpose", revision: "Adopted 20 July 2000", url: "https://database.ich.org/sites/default/files/E10_Guideline.pdf"}
  - {id: "ich-e10-1-4", title: "ICH E10 — Section 1.4: Purposes of clinical trials and related issues", revision: "Adopted 20 July 2000", url: "https://database.ich.org/sites/default/files/E10_Guideline.pdf"}
stage_guidance: "Assess a candidate profile, not a trial protocol. A provisional comparison or an explicit plan to determine it is acceptable. Do not impose placebo, superiority, non-inferiority, or an active comparator universally."
sections:
  - name: "Clinical comparison basis"
    description: "The candidate profile identifies the comparison underlying its clinical benefit target."
    source_refs: ["ich-e10-1-1", "ich-e10-1-4"]
    expectations: "Accept a reasoned comparison basis or a stated unresolved choice and how it will be settled. Do not require a finalized control-group design."
