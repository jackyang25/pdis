id: ich-e10-ipdp
revision: "1.0"
org: bmgf
source_type: ipdp
intervention_class: drug
display_name: "ICH E10: control strategy"
authority: "PDIS-authored adaptation informed by ICH E10; source copyright ICH, no ICH endorsement"
scope: "Selected control-choice and interpretability planning expectations; not a trial-design approval or external evidence assessment."
evidence_scope: whole_document
sources:
  - {id: "ich-e10-1-1", title: "ICH E10 — Section 1.1: General scheme and purpose", revision: "Adopted 20 July 2000", url: "https://database.ich.org/sites/default/files/E10_Guideline.pdf"}
  - {id: "ich-e10-3", title: "ICH E10 — Section 3: Choosing the concurrent control group", revision: "Adopted 20 July 2000", url: "https://database.ich.org/sites/default/files/E10_Guideline.pdf"}
  - {id: "ich-e10-1-5", title: "ICH E10 — Section 1.5: Assay sensitivity", revision: "Adopted 20 July 2000", url: "https://database.ich.org/sites/default/files/E10_Guideline.pdf"}
  - {id: "ich-e10-2-5", title: "ICH E10 — Section 2.5: External control", revision: "Adopted 20 July 2000", url: "https://database.ich.org/sites/default/files/E10_Guideline.pdf"}
stage_guidance: "Assess a strategic IPDP. Accept planned decisions, and do not require a full protocol or mandate a particular control. If no controlled efficacy study is proposed, accept an explicit alternative evidence strategy and its rationale."
sections:
  - name: "Control-choice rationale"
    description: "The plan explains its proposed clinical control or comparison strategy."
    source_refs: ["ich-e10-1-1", "ich-e10-3"]
    expectations: "Look for a rationale addressing existing care and ethical constraints, not simply a comparator name."
  - name: "Interpretable comparison planning"
    description: "The plan addresses material limitations of inference from the proposed comparison."
    source_refs: ["ich-e10-1-5", "ich-e10-2-5"]
    expectations: "For proposed non-inferiority or equivalence, look for plans to justify assay sensitivity and the margin; for external controls, address comparability and bias. Do not demand these design-specific details when that design is not proposed."
