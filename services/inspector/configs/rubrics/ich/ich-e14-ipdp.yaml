id: ich-e14-ipdp
revision: "1.0"
org: bmgf
source_type: ipdp
intervention_class: drug
display_name: "ICH E14: QT evaluation plan"
authority: PDIS-authored adaptation informed by ICH E14 and the 2022 E14/S7B Q&As
scope: Selected QT-planning expectations for explicitly confirmed small-molecule, systemically exposed, non-antiarrhythmic candidates; not a regulatory conclusion.
evidence_scope: whole_document
sources:
  - {id: ich-e14-sections-2-1-2-4, title: "ICH E14 — Sections 2.1–2.4", revision: "Adopted 12 May 2005", url: "https://database.ich.org/sites/default/files/E14_Guideline.pdf"}
  - {id: ich-e14-s7b-qa-5-1, title: "E14/S7B Q&A 5.1", revision: "Adopted 21 February 2022", url: "https://database.ich.org/sites/default/files/E14-S7B_QAs_Step4_2022_0221.pdf"}
  - {id: ich-e14-s7b-qa-6-1, title: "E14/S7B Q&A 6.1", revision: "Adopted 21 February 2022", url: "https://database.ich.org/sites/default/files/E14-S7B_QAs_Step4_2022_0221.pdf"}
stage_guidance: Assess the proposed strategy, not completed trial conduct. Do not require a dedicated thorough-QT study in every program.
sections:
  - name: QT evaluation strategy
    description: The plan states how QT liability will be evaluated using an approach appropriate to the available evidence.
    source_refs: [ich-e14-sections-2-1-2-4, ich-e14-s7b-qa-5-1, ich-e14-s7b-qa-6-1]
    expectations: Accept concentration-response or integrated approaches where justified; identify timing and remaining evidence needs.
  - name: Later-trial safety connection
    description: The QT evaluation strategy is connected to monitoring or design decisions in later clinical safety planning.
    source_refs: [ich-e14-sections-2-1-2-4]
    expectations: Expect the plan to explain how earlier findings will inform later trials without predicting regulatory acceptance.
