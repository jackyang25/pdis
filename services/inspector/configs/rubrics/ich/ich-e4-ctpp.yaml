id: ich-e4-ctpp
revision: "1.0"
org: bmgf
source_type: ctpp
intervention_class: drug
display_name: "ICH E4: candidate dose rationale"
authority: PDIS-authored adaptation informed by ICH E4
scope: Selected candidate-level dose-response planning expectations; not evidence that ICH studies are complete.
evidence_scope: whole_document
sources:
  - {id: ich-e4-section-i, title: "ICH E4 — Section I: Dose-response information", revision: "Adopted 10 March 1994", url: "https://database.ich.org/sites/default/files/E4_Guideline.pdf"}
  - {id: ich-e4-section-ii, title: "ICH E4 — Section II: Obtaining dose-response information", revision: "Adopted 10 March 1994", url: "https://database.ich.org/sites/default/files/E4_Guideline.pdf"}
  - {id: ich-e4-section-iii, title: "ICH E4 — Section III: Study designs", revision: "Adopted 10 March 1994", url: "https://database.ich.org/sites/default/files/E4_Guideline.pdf"}
stage_guidance: A candidate profile should distinguish a proposed regimen from completed evidence and make unresolved evidence needs visible.
sections:
  - name: Candidate dose and regimen rationale
    description: The candidate dose or regimen has a stated rationale relating benefit and adverse effects.
    source_refs: [ich-e4-section-i, ich-e4-section-ii]
    expectations: A proposed dose alone is insufficient; accept an explicit rationale plus a candid statement of evidence limits.
  - name: Dose-response evidence gaps
    description: Unresolved dose-response, concentration-response or time-course evidence needs are identified.
    source_refs: [ich-e4-section-i, ich-e4-section-iii]
    expectations: Do not mandate one study design, numeric dose, or therapeutic monitoring for every product.
