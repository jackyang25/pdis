id: ich-e4-ipdp
revision: "1.0"
org: bmgf
source_type: ipdp
intervention_class: drug
display_name: "ICH E4: dose-response development plan"
authority: PDIS-authored adaptation informed by ICH E4
scope: Selected planning expectations for generating dose/exposure-response evidence over time; not an exhaustive ICH E4 review.
evidence_scope: whole_document
sources:
  - {id: ich-e4-section-i, title: "ICH E4 — Section I: Dose-response information", revision: "Adopted 10 March 1994", url: "https://database.ich.org/sites/default/files/E4_Guideline.pdf"}
  - {id: ich-e4-section-ii, title: "ICH E4 — Section II: Obtaining dose-response information", revision: "Adopted 10 March 1994", url: "https://database.ich.org/sites/default/files/E4_Guideline.pdf"}
  - {id: ich-e4-section-iii, title: "ICH E4 — Section III: Study designs", revision: "Adopted 10 March 1994", url: "https://database.ich.org/sites/default/files/E4_Guideline.pdf"}
stage_guidance: Assess planned work as plans; do not require studies to have started or completed.
sections:
  - name: Dose-response development strategy
    description: Planned work will characterize desired and adverse effects across dose or exposure.
    source_refs: [ich-e4-section-ii, ich-e4-section-iii]
    expectations: The plan may choose among suitable designs but should explain how the evidence will support regimen selection.
  - name: Time-course considerations
    description: The plan addresses clinically relevant changes in response over time or explains why they are not expected to alter regimen selection.
    source_refs: [ich-e4-section-i]
    expectations: Consider onset, maintenance, duration, accumulation, tolerance, and dosing interval only where relevant to the proposed use.
