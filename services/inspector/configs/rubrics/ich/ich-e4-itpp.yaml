id: ich-e4-itpp
revision: "1.0"
updated_on: "2026-09-11"
display_name: "ICH E4: dose-response intent"
authority: PDIS-authored adaptation informed by ICH E4
scope: Selected document-level expectations for dose, regimen, desired effects and tolerability; not an exhaustive ICH E4 review.
evidence_scope: whole_document
sources: &e4_sources
  - {id: ich-e4-section-i, title: "ICH E4 — Section I: Dose-response information", revision: "Adopted 10 March 1994", url: "https://database.ich.org/sites/default/files/E4_Guideline.pdf"}
stage_guidance: A target profile may state qualitative regimen goals. Do not demand a selected dose or completed study.
sections:
  - name: Dose and regimen intent
    description: The profile states the intended regimen and relates desired effects to tolerability.
    source_refs: [ich-e4-section-i]
    expectations: Accept qualitative goals at target-profile depth; assess whether both desired effects and tolerability inform the stated intent.
