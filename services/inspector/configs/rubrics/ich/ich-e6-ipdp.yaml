id: ich-e6-ipdp
revision: "1.0"
updated_on: "2026-09-11"
display_name: "ICH E6(R3): clinical planning"
authority: PDIS-authored adaptation informed by ICH E6(R3) Principles and Annex 1
scope: Selected strategic clinical-planning and critical-to-quality risk expectations; not GCP certification or a trial-conduct audit.
evidence_scope: whole_document
sources:
  - {id: ich-e6-r3-principles, title: "ICH E6(R3) — Principles", revision: "Adopted 6 January 2025", url: "https://www.ema.europa.eu/en/documents/scientific-guideline/ich-e6-r3-guideline-good-clinical-practice-gcp-step-5_en.pdf"}
  - {id: ich-e6-r3-annex1-3-1, title: "ICH E6(R3) Annex 1 — Section 3.1", revision: "Adopted 6 January 2025", url: "https://www.ema.europa.eu/en/documents/scientific-guideline/ich-e6-r3-guideline-good-clinical-practice-gcp-step-5_en.pdf"}
  - {id: ich-e6-r3-annex1-3-10-1, title: "ICH E6(R3) Annex 1 — Section 3.10.1", revision: "Adopted 6 January 2025", url: "https://www.ema.europa.eu/en/documents/scientific-guideline/ich-e6-r3-guideline-good-clinical-practice-gcp-step-5_en.pdf"}
stage_guidance: Assess a strategic development plan. Accept future actions and do not demand site records, executed consent forms, or a complete protocol.
sections:
  - name: Clinical planning basis
    description: Planned clinical work has a documented scientific and operational basis proportionate to its purpose.
    source_refs: [ich-e6-r3-principles, ich-e6-r3-annex1-3-1]
    expectations: Look for design rationale, participant protection, reliable-result considerations and fit-for-purpose planning at strategic depth.
  - name: Critical-to-quality risk planning
    description: Factors critical to participant protection and reliable results are identified with proportionate risk controls.
    source_refs: [ich-e6-r3-annex1-3-10-1]
    expectations: Expect identification, evaluation and proportionate control of material risks, not a completed trial risk log.
