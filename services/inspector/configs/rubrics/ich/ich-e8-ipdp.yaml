id: ich-e8-ipdp
revision: "1.0"
updated_on: "2026-09-11"
display_name: "ICH E8(R1): development evidence strategy"
authority: "PDIS-authored adaptation informed by ICH E8(R1); source copyright ICH, no ICH endorsement"
scope: "Selected development-sequence and population-planning expectations; not a comprehensive E8 review."
evidence_scope: whole_document
sources:
  - {id: "ich-e8-4-3", title: "ICH E8(R1) — Section 4.3: Clinical studies", revision: "Adopted 6 October 2021; corrected 4 August 2022", url: "https://database.ich.org/sites/default/files/ICH_E8-R1_Guideline_Step4_2021_1006.pdf"}
  - {id: "ich-e8-4-3-3", title: "ICH E8(R1) — Section 4.3.3: Special Populations", revision: "Adopted 6 October 2021; corrected 4 August 2022", url: "https://database.ich.org/sites/default/files/ICH_E8-R1_Guideline_Step4_2021_1006.pdf"}
  - {id: "ich-e8-5-1", title: "ICH E8(R1) — Section 5.1: Study population", revision: "Adopted 6 October 2021; corrected 4 August 2022", url: "https://database.ich.org/sites/default/files/ICH_E8-R1_Guideline_Step4_2021_1006.pdf"}
  - {id: "ich-e8-2-3", title: "ICH E8(R1) — Section 2.3: Patient input into drug development", revision: "Adopted 6 October 2021; corrected 4 August 2022", url: "https://database.ich.org/sites/default/files/ICH_E8-R1_Guideline_Step4_2021_1006.pdf"}
stage_guidance: "Assess a strategic IPDP, not a protocol. Future work with a stated purpose counts; do not require a fixed sequence of numbered phases or completed studies. Clinical trial conduct is outside this review."
sections:
  - name: "Development evidence sequence"
    description: "The plan explains how successive clinical studies address development questions and inform later work."
    source_refs: ["ich-e8-4-3"]
    expectations: "Accept overlapping or combined phases with a stated rationale; assess the documented dependencies, not programme feasibility."
  - name: "Intended-population evidence"
    description: "The plan addresses how clinical evidence will cover the intended population and identifies relevant population gaps."
    source_refs: ["ich-e8-4-3-3", "ich-e8-5-1"]
    expectations: "Accept a staged plan; do not demand studies in every special population regardless of intended use."
  - name: "Patient input in development"
    description: "The plan states how patient or caregiver perspectives inform clinically relevant development choices."
    source_refs: ["ich-e8-2-3"]
    expectations: "Accept a proportionate approach or a reasoned explanation of constraints; do not demand completed consultation records."
