id: ich-e9-ctpp
revision: "1.0"
updated_on: "2026-09-11"
display_name: "ICH E9: treatment-effect targets"
authority: "PDIS-authored adaptation informed by ICH E9 and ICH E9(R1); source copyright ICH, no ICH endorsement"
scope: "Selected candidate-level endpoint and treatment-effect expectations informed by E9 and its estimand addendum; not a statistical-analysis-plan audit."
evidence_scope: whole_document
sources:
  - {id: "ich-e9-2-2-2", title: "ICH E9 — Section 2.2.2: Primary and secondary variables", revision: "Adopted 5 February 1998", url: "https://database.ich.org/sites/default/files/E9_Guideline.pdf"}
  - {id: "ich-e9r1-a-3-3", title: "ICH E9(R1) — Section A.3.3: Estimand attributes", revision: "Adopted 20 November 2019", url: "https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf"}
stage_guidance: "Assess a candidate profile. Accept provisional choices and explicitly identified decisions to resolve; do not demand a complete estimand, protocol, sample-size calculation, or statistical analysis plan."
sections:
  - name: "Interpretable clinical target"
    description: "The candidate's clinical target states the intended population, outcome and observation period clearly enough to interpret the proposed effect."
    source_refs: ["ich-e9-2-2-2", "ich-e9r1-a-3-3"]
    expectations: "Accept plain language; an endpoint name or numerical ambition without its clinical meaning is not enough."
