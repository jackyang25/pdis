id: ich-e9-ipdp
revision: "1.0"
org: bmgf
source_type: ipdp
intervention_class: drug
display_name: "ICH E9: statistical planning"
authority: "PDIS-authored adaptation informed by ICH E9(R1) and ICH E9; source copyright ICH, no ICH endorsement"
scope: "Selected statistical-design and estimand-planning expectations; not verification of calculations or a complete E9 compliance review."
evidence_scope: whole_document
sources:
  - {id: "ich-e9r1-a-3-3", title: "ICH E9(R1) — Section A.3.3: Estimand attributes", revision: "Adopted 20 November 2019", url: "https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf"}
  - {id: "ich-e9r1-a-4", title: "ICH E9(R1) — Section A.4: Impact on trial design and conduct", revision: "Adopted 20 November 2019", url: "https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf"}
  - {id: "ich-e9-3-5", title: "ICH E9 — Section 3.5: Sample size", revision: "Adopted 5 February 1998", url: "https://database.ich.org/sites/default/files/E9_Guideline.pdf"}
  - {id: "ich-e9-5-3", title: "ICH E9 — Section 5.3: Missing values and outliers", revision: "Adopted 5 February 1998", url: "https://database.ich.org/sites/default/files/E9_Guideline.pdf"}
  - {id: "ich-e9r1-a-5-2", title: "ICH E9(R1) — Section A.5.2: Sensitivity analysis", revision: "Adopted 20 November 2019", url: "https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf"}
stage_guidance: "Assess a strategic IPDP. A plan to resolve specified statistical choices is acceptable at this maturity; do not demand a finished protocol or statistical analysis plan. Judge what is documented, not whether a target is achievable."
sections:
  - name: "Treatment-effect definition plan"
    description: "The plan explains which treatment effect the clinical work will estimate."
    source_refs: ["ich-e9r1-a-3-3", "ich-e9r1-a-4"]
    expectations: "Look for treatment comparison, population, endpoint and summary measure, plus plans for relevant intercurrent events. Accept explicit unresolved choices with a resolution plan; do not confuse missing observations with intercurrent events."
  - name: "Study-size rationale"
    description: "The plan provides a rationale or a defined approach for determining study size relative to its objective."
    source_refs: ["ich-e9-3-5"]
    expectations: "Accept preliminary assumptions or planned calculations; do not require one statistical design or independently validate the arithmetic."
  - name: "Analysis robustness planning"
    description: "The plan addresses missing observations and how robustness of the intended analysis will be examined."
    source_refs: ["ich-e9-5-3", "ich-e9r1-a-5-2"]
    expectations: "Accept strategic commitments tied to the planned studies. Sensitivity analysis addresses the same estimand; a different treatment-effect question is supplementary analysis."
