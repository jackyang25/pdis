id: ich-m3-ipdp
revision: "1.0"
org: bmgf
source_type: ipdp
intervention_class: drug
display_name: "ICH M3(R2): nonclinical development planning"
authority: "PDIS-authored adaptation informed by ICH M3(R2); source copyright ICH, no ICH endorsement"
scope: "Selected nonclinical planning expectations for confirmed small-molecule products only; not the full M3 scope or a toxicology adequacy verdict."
evidence_scope: whole_document
sources:
  - {id: "ich-m3-1-3", title: "ICH M3(R2) — Section 1.3: Scope of the guideline", revision: "Adopted 11 June 2009", url: "https://database.ich.org/sites/default/files/M3_R2__Guideline.pdf"}
  - {id: "ich-m3-5-1", title: "ICH M3(R2) — Section 5.1: Clinical development trials", revision: "Adopted 11 June 2009", url: "https://database.ich.org/sites/default/files/M3_R2__Guideline.pdf"}
  - {id: "ich-m3-3", title: "ICH M3(R2) — Section 3: Toxicokinetic and pharmacokinetic studies", revision: "Adopted 11 June 2009", url: "https://database.ich.org/sites/default/files/M3_R2__Guideline.pdf"}
  - {id: "ich-m3-6", title: "ICH M3(R2) — Section 6: Estimation of the first dose in human", revision: "Adopted 11 June 2009", url: "https://database.ich.org/sites/default/files/M3_R2__Guideline.pdf"}
  - {id: "ich-m3-11", title: "ICH M3(R2) — Section 11: Reproduction toxicity studies", revision: "Adopted 11 June 2009", url: "https://database.ich.org/sites/default/files/M3_R2__Guideline.pdf"}
  - {id: "ich-m3-12", title: "ICH M3(R2) — Section 12: Clinical trials in pediatric populations", revision: "Adopted 11 June 2009", url: "https://database.ich.org/sites/default/files/M3_R2__Guideline.pdf"}
stage_guidance: "Assess a strategic IPDP. This authored adaptation is deliberately limited to confirmed small molecules. Accept future studies and justified tailored approaches; do not require every toxicity study, fixed species, study durations, or completed reports. Assess the rationale stated, not biological safety."
sections:
  - name: "Nonclinical support for clinical progression"
    description: "The plan links nonclinical safety work to the scope and sequence of planned clinical exposure."
    source_refs: ["ich-m3-1-3", "ich-m3-5-1"]
    expectations: "Look for decision dependencies and timing, not completed safety data."
  - name: "Initial exposure rationale planning"
    description: "The plan explains how nonclinical and exposure information will inform initial human dosing."
    source_refs: ["ich-m3-3", "ich-m3-6"]
    expectations: "Accept a planned basis for the starting-dose decision; do not independently calculate a safe dose."
  - name: "Population-specific nonclinical planning"
    description: "The plan considers additional nonclinical support relevant to the intended clinical population."
    source_refs: ["ich-m3-11", "ich-m3-12"]
    expectations: "Accept a documented rationale for what is needed or not needed; do not require reproductive or juvenile studies irrespective of planned participants."
