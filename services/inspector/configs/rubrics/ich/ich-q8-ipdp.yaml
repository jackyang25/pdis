id: ich-q8-ipdp
revision: "1.0"
updated_on: "2026-09-11"
display_name: "ICH Q8(R2): pharmaceutical development"
authority: "PDIS-authored adaptation informed by ICH Q8(R2); source copyright ICH, no ICH endorsement"
scope: "Selected pharmaceutical-development planning expectations; not a manufacturing validation or marketing-submission audit."
evidence_scope: whole_document
sources:
  - {id: "ich-q8-part-i-2-2-1", title: "ICH Q8(R2) — Section Part I, 2.2.1: Formulation development", revision: "Revision August 2009", url: "https://database.ich.org/sites/default/files/Q8_R2_Guideline.pdf"}
  - {id: "ich-q8-part-i-2-3", title: "ICH Q8(R2) — Section Part I, 2.3: Manufacturing process development", revision: "Revision August 2009", url: "https://database.ich.org/sites/default/files/Q8_R2_Guideline.pdf"}
  - {id: "ich-q8-part-ii-2-2", title: "ICH Q8(R2) — Section Part II, 2.2: Critical quality attributes", revision: "Revision August 2009", url: "https://database.ich.org/sites/default/files/Q8_R2_Guideline.pdf"}
  - {id: "ich-q8-part-ii-2-5", title: "ICH Q8(R2) — Section Part II, 2.5: Control strategy", revision: "Revision August 2009", url: "https://database.ich.org/sites/default/files/Q8_R2_Guideline.pdf"}
stage_guidance: "Assess an IPDP's future programme, not a completed CTD. Accept planned work; design space and real-time release are not mandatory. Quality risk governance is reviewed separately from the development activities here."
sections:
  - name: "Product and process development plan"
    description: "The plan connects pharmaceutical development activities to product quality needs."
    source_refs: ["ich-q8-part-i-2-2-1", "ich-q8-part-i-2-3"]
    expectations: "Accept planned formulation and process work rather than completed validation."
  - name: "Quality control strategy planning"
    description: "The plan states how quality attributes will inform the intended control strategy."
    source_refs: ["ich-q8-part-ii-2-2", "ich-q8-part-ii-2-5"]
    expectations: "Accept an approach to define controls as understanding develops; do not mandate enhanced development methods."
