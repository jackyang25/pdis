id: ich-q9-ipdp
revision: "1.0"
org: bmgf
source_type: ipdp
intervention_class: drug
display_name: "ICH Q9(R1): pharmaceutical quality risks"
authority: "PDIS-authored adaptation informed by ICH Q9(R1); source copyright ICH, no ICH endorsement"
scope: "Selected pharmaceutical-quality risk planning expectations; not programme, investment, or clinical-trial risk scoring."
evidence_scope: whole_document
sources:
  - {id: "ich-q9-3", title: "ICH Q9(R1) — Section 3: Principles of quality risk management", revision: "Adopted 18 January 2023", url: "https://database.ich.org/sites/default/files/ICH_Q9(R1)_Guideline_Step4_2022_1219.pdf"}
  - {id: "ich-q9-4-3", title: "ICH Q9(R1) — Section 4.3: Risk assessment", revision: "Adopted 18 January 2023", url: "https://database.ich.org/sites/default/files/ICH_Q9(R1)_Guideline_Step4_2022_1219.pdf"}
  - {id: "ich-q9-4-1", title: "ICH Q9(R1) — Section 4.1: Responsibilities", revision: "Adopted 18 January 2023", url: "https://database.ich.org/sites/default/files/ICH_Q9(R1)_Guideline_Step4_2022_1219.pdf"}
  - {id: "ich-q9-4-4", title: "ICH Q9(R1) — Section 4.4: Risk control", revision: "Adopted 18 January 2023", url: "https://database.ich.org/sites/default/files/ICH_Q9(R1)_Guideline_Step4_2022_1219.pdf"}
  - {id: "ich-q9-4-5", title: "ICH Q9(R1) — Section 4.5: Risk communication", revision: "Adopted 18 January 2023", url: "https://database.ich.org/sites/default/files/ICH_Q9(R1)_Guideline_Step4_2022_1219.pdf"}
  - {id: "ich-q9-4-6", title: "ICH Q9(R1) — Section 4.6: Risk review", revision: "Adopted 18 January 2023", url: "https://database.ich.org/sites/default/files/ICH_Q9(R1)_Guideline_Step4_2022_1219.pdf"}
  - {id: "ich-q9-5-1", title: "ICH Q9(R1) — Section 5.1: Formality in quality risk management", revision: "Adopted 18 January 2023", url: "https://database.ich.org/sites/default/files/ICH_Q9(R1)_Guideline_Step4_2022_1219.pdf"}
stage_guidance: "Assess documented quality-risk planning at strategic depth. Accept qualitative and proportionate methods; do not demand FMEA, numerical risk scores, or a completed manufacturing risk register. Do not assign programme risk or funding advice."
sections:
  - name: "Quality-risk assessment approach"
    description: "The plan identifies pharmaceutical quality hazards and an approach to evaluate their potential patient consequences."
    source_refs: ["ich-q9-3", "ich-q9-4-3"]
    expectations: "Look for relevant assumptions and uncertainty, not a generic programme-risk list."
  - name: "Quality-risk control responsibilities"
    description: "The plan assigns responsibility for addressing identified quality risks and communicating decisions."
    source_refs: ["ich-q9-4-1", "ich-q9-4-4", "ich-q9-4-5"]
    expectations: "Accept planned controls and decision responsibilities without demanding an executed quality system."
  - name: "Quality-risk review plan"
    description: "The plan explains when quality-risk assessments will be revisited as knowledge changes."
    source_refs: ["ich-q9-4-6", "ich-q9-5-1"]
    expectations: "Accept milestones or change triggers rather than a prescribed review frequency."
