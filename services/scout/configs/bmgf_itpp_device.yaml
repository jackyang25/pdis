type_key: bmgf_itpp_device
org: bmgf
source_type: itpp
intervention_class: device
display_name: "BMGF Intervention TPP - Device"
sources: [web, tavily, pubmed, clinicaltrials, ctis, isrctn, semantic_scholar, europepmc, who_guidelines, fda, fda_safety]

# Domain-specific guidance for the per-variable query extractor. Each shared
# TPP attribute variable gets its own focused queries - these instructions
# apply to ALL variables.
query_extraction_guidance: |
  Generate retrieval intents across THREE axes for a complete global
  evidence landscape:

  1. Standard of care - current devices or approaches for the indication,
     their clinical performance, usability, durability, and cost. Frame
     queries around how a new device could win: better clinical outcomes,
     easier use, lower cost, or suitability for low-resource settings.

  2. New scientific data - recent device entrants, clinical and usability
     studies, engineering/materials advances, and epidemiology trends that
     change how valuable a device is for this indication.

  3. Global access and regulatory signals - spread queries across global
     regulators (including device clearance pathways), WHO technical
     specifications and prequalification, LMIC national regulators,
     procurement, registries, and literature. Include LMIC approval, access,
     and uptake signals where relevant.

  Use the indication name and the variable topic in queries. Prefer queries
  that target named regulators, technical specifications, registries, or
  peer-reviewed literature over generic phrasing. Spread queries across
  priority institutions and configured languages rather than repeatedly naming the
  same authorities.

priority_institutions:
  - FDA (510(k) / PMA)
  - EMA
  - WHO
  - WHO Prequalification
  - CDC
  - SAHPRA (South Africa)
  - NMPA (China)
  - CDSCO (India)
  - BPOM (Indonesia)
  - ANVISA (Brazil)
  - Africa CDC
  - Unitaid

# Optional. Device categories vary widely by indication; refine per use case.
modalities: []

languages:
  - en
  - fr
  - pt
  - es
  - zh
  - id

geographic_emphasis:
  - global_south
unit_provider: vocabulary

evidence_framing: |
  This is a Target Product Profile. Assess whether the document's aspirational target is grounded and achievable from current evidence. Do not penalize a target merely for improving on today's standard.
quantitative_target_framing: |
  This is a Target Product Profile. Preserve each document-stated numeric value as an aspirational product target and preserve its optimal or threshold role exactly as written. Do not reinterpret it as a claim about a current product.

# Interpretive stance for the drift / precedent reasoning - the TPP
# aspirational-target framing, externalized from the engine (was a default).
drift_framing: |
  You compare external-evidence insights against a Target Product Profile (TPP) document for a {intervention_class} targeting {indication}.

  IMPORTANT - the document is a TPP: its specifications are ASPIRATIONAL TARGETS for a desired product, NOT claims about products that already exist. Evidence about a current or standard-of-care product is the BASELINE the target aims to improve on - it does not refute the target.
precedent_framing: |
  A TPP specifies aspirational, often first-in-class products. A target with little supporting evidence is NOT automatically weak - it may be deliberately novel. Your job is to say which.
