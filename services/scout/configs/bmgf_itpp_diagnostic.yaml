type_key: bmgf_itpp_diagnostic
org: bmgf
source_type: itpp
intervention_class: diagnostic
display_name: "BMGF Intervention TPP - Diagnostic"
sources: [web, pubmed, clinicaltrials, ctis, isrctn, semantic_scholar, open_targets, chembl, uniprot, fda]

# Domain-specific guidance for the per-variable query extractor. Each shared
# TPP attribute variable gets its own focused queries - these instructions
# apply to ALL variables.
query_extraction_guidance: |
  Generate retrieval intents across THREE axes for a complete global
  evidence landscape:

  1. Standard of care - current diagnostic methods for the indication, their
     sensitivity, specificity, time-to-result, cost, and setting (central lab
     vs. point-of-care). Frame queries around how a new test could win: higher
     sensitivity/specificity, faster result, lower cost, or decentralized /
     point-of-care use.

  2. New scientific data - recent assay platforms, comparative performance
     evaluations, clinical validation studies, and epidemiology trends that
     change how valuable a test is for this indication.

  3. Global access and regulatory signals - spread queries across global
     regulators, IVD prequalification, evaluation bodies, LMIC national
     regulators, procurement, registries, and literature. Include WHO IVD
     prequalification, FIND evaluations, LMIC approval, access, and uptake
     signals where relevant.

  Use the indication name and the variable topic in queries. Prefer queries
  that target named regulators, evaluation bodies, registries, or
  peer-reviewed literature over generic phrasing. Spread queries across
  priority institutions and configured languages rather than repeatedly naming the
  same authorities.

priority_institutions:
  - FDA
  - EMA
  - WHO
  - WHO Prequalification (IVD)
  - FIND
  - CDC
  - SAHPRA (South Africa)
  - NMPA (China)
  - CDSCO (India)
  - BPOM (Indonesia)
  - ANVISA (Brazil)
  - Africa CDC
  - Unitaid

modalities:
  - NAAT / PCR
  - rapid diagnostic test (RDT)
  - antigen test
  - serology / ELISA
  - LAMP
  - point-of-care molecular
  - next-generation sequencing

languages:
  - en
  - fr
  - pt
  - es
  - zh
  - id

queries_per_variable: 8
geographic_emphasis:
  - global_south
geographic_queries_per_variable: 4
counterfactual_queries_per_variable: 3
precedent_queries_per_variable: 3
unit_provider: vocabulary

evidence_framing: |
  This is a Target Product Profile. Assess whether the document's aspirational target is grounded and achievable from current evidence. Do not penalize a target merely for improving on today's standard.
conformity_framing: |
  This is a Target Product Profile. The numeric value is an aspirational product target. Score how strongly current external evidence aligns with that target; a low result can indicate intentional ambition rather than document failure.

# Interpretive stance for the drift / precedent reasoning - the TPP
# aspirational-target framing, externalized from the engine (was a default).
drift_framing: |
  You compare external-evidence insights against a Target Product Profile (TPP) document for a {intervention_class} targeting {indication}.

  IMPORTANT - the document is a TPP: its specifications are ASPIRATIONAL TARGETS for a desired product, NOT claims about products that already exist. Evidence about a current or standard-of-care product is the BASELINE the target aims to improve on - it does not refute the target.
precedent_framing: |
  A TPP specifies aspirational, often first-in-class products. A target with little supporting evidence is NOT automatically weak - it may be deliberately novel. Your job is to say which.
