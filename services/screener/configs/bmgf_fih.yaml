# First in Human — the stage-gate question bank, transcribed.
#
# Transcribed by hand from the source named in `mirrors`, not parsed from it.
# That document is what this file was checked against; this file is the source
# everything downstream reads.
#
# The source guarantees three axes and this file carries exactly those three: the
# gate, the owning discipline, and whether the gate requires a question answered
# now (`required`) or expects it to be forming (`anticipatory`). Nothing else is
# transcribed and nothing is inferred — an earlier bank carried a hint about which
# document usually answers a question, which no source states, and it was removed.
#
# `intervention_classes` is a fact about the whole document rather than about any
# question: it derives from a drug milestone dictionary and asks about synthetic
# routes, salt and polymorph selection and BCS class, so a vaccine or a mAb has no
# answer to give. A run for another class is refused rather than returned with every
# question inapplicable, because a review of nothing reads like a review that found
# nothing wrong.

org: bmgf
gate:
  id: fih
  label: First in Human
  ordinal: 3

intervention_classes: [drug]

mirrors: >-
  Stage Gate Questions - All Gates.docx, developed from the Drug Development Milestone
  Dictionary (PDID). LCS questions reviewed by the Certara team, 7/13.

disciplines:
  - id: pds
    label: Product Development Strategy
    questions:
      - id: PDS.FIH.1
        requirement: required
        text: >-
          Is the candidate TPP agreed, covering drug need, use case, market, global-health
          impact, and required product characteristics?

      - id: PDS.FIH.2
        requirement: required
        text: >-
          Is there a clear business case - value proposition vs. the disease strategy and
          alternatives, with estimated costs to launch and drive uptake?

      - id: PDS.FIH.3
        requirement: required
        text: >-
          Is the market understood (size, segments, user needs)?

      - id: PDS.FIH.4
        requirement: required
        text: >-
          Has a deliverability assessment identified key risks/opportunities (improvement vs.
          SoC, financing, policy/regulatory pathway, supply chain, delivery mode,
          provider/user issues)?

      - id: PDS.FIH.5
        requirement: required
        text: >-
          Is the strategic-demand-forecast methodology agreed (aligned to the BMGF valuation
          model)?

      - id: PDS.FIH.6
        requirement: required
        text: >-
          Is the COGS methodology agreed, and has an initial aspirational COGS been set to
          drive the TPP and cost goals?

      - id: PDS.FIH.7
        requirement: required
        text: >-
          Is the cost-effectiveness methodology agreed (aligned to the BMGF valuation model)?

      - id: PDS.FIH.8
        requirement: required
        text: >-
          Are Global Access commitments in place (affordable price, sufficient supply for
          developing countries, data access, license, publication/open access)?

      - id: PDS.FIH.9
        requirement: required
        text: >-
          Is the candidate TPP aligned with partner organizations?

      - id: PDS.FIH.10
        requirement: required
        text: >-
          Do clinical data, market assumptions, and deliverability risks still favor the
          candidate's market need, viability, and business value?

  - id: cmc
    label: Chemistry, Manufacturing and Controls (CMC)
    questions:
      - id: CMC.FIH.1
        requirement: required
        text: >-
          Is the delivery & formulation strategy for animal and human studies defined (IV,
          injection, tablet, capsule, oral strip, inhalant, prodrug, etc.), and has IP space
          been assessed if a special delivery system is needed?

      - id: CMC.FIH.2
        requirement: required
        text: >-
          For injectables, have hemolysis, drug adhesion to syringes/tubing/equipment, and
          precipitation at the injection site been evaluated in vitro?

      - id: CMC.FIH.3
        requirement: required
        text: >-
          For a prodrug, has in vitro and in vivo conversion to the active form been
          characterized?

      - id: CMC.FIH.4
        requirement: required
        text: >-
          Have particle-size considerations and formulation dependency been assessed
          (including any need for milling/micronization), and have excipients been selected
          and characterized?

      - id: CMC.FIH.5
        requirement: required
        text: >-
          Are form-specific physicochemical properties characterized - bulk/tap density,
          flowability, compressibility, pXRD, IR, dissolution, disintegration?

      - id: CMC.FIH.6
        requirement: required
        text: >-
          Are form- and formulation-specific in-use stability studies complete, and has the
          need to 'blind' the clinical formulation been determined from bioavailability/PK for
          the dosing regimen?

      - id: CMC.FIH.7
        requirement: required
        text: >-
          Is the initial cGMP process defined for DS and DP (synthetic pathways, intermediate
          selection, unit operations, equipment)?

      - id: CMC.FIH.8
        requirement: required
        text: >-
          Are reference standards and GMP analytical methods for DS/DP release and stability
          in place, with impurity specifications set for both DS and DP?

      - id: CMC.FIH.9
        requirement: required
        text: >-
          Has GMP DS and Phase 1 DP been manufactured and released with a Certificate of
          Analysis?

      - id: CMC.FIH.10
        requirement: required
        text: >-
          Is the CMC development plan updated with a scale-up plan to kilo-scale for Phase 2,
          identified risks to PQ with mitigations, and an IPDP provided one month before the
          gate?

  - id: cp
    label: Clinical Pharmacology
    questions:
      - id: CP.FIH.1
        requirement: required
        text: >-
          Is there a detailed rationale for the Phase 1 dose range and target clinical
          exposures?

      - id: CP.FIH.2
        requirement: required
        text: >-
          Are nonclinical PK/PD/ADME data (biomarker ID, in vitro vs. in vivo, animal model,
          modeling) sufficient to project human exposure?

      - id: CP.FIH.3
        requirement: required
        text: >-
          Is bioavailability / distribution characterized (tissue, serum, CSF, blood-brain as
          relevant to the indication)?

      - id: CP.FIH.4
        requirement: required
        text: >-
          Have supporting bioanalytical methods (e.g., LC-MS/MS) been developed and qualified
          for both animal and human application?

      - id: CP.FIH.5
        requirement: required
        text: >-
          Is the FIH starting dose justified from NOAEL / safety margins together with PK-PD
          modeling?

      - id: CP.FIH.6
        requirement: required
        text: >-
          Is the dose formulation and regimen defined for the Phase 1 study?

      - id: CP.FIH.7
        requirement: required
        text: >-
          Do toxicokinetic results support the doses and dosing duration anticipated for Phase
          2?

      - id: CP.FIH.8
        requirement: required
        text: >-
          Is a drug-combination assessment and plan included where the product will be used in
          combination?

      - id: CP.FIH.9
        requirement: required
        text: >-
          Has the formulation's bioavailability / PK for the clinical dosing regimen been
          assessed (including any blinding need)?

      - id: CP.FIH.10
        requirement: required
        text: >-
          Is the argument for an acceptable drug-interaction profile (and any prior human
          exposure) documented for the pre-IND/IND?

  - id: ns
    label: Nonclinical Safety
    questions:
      - id: NS.FIH.1
        requirement: required
        text: >-
          Are acute and subchronic (repeat-dose) GLP animal toxicology studies completed in
          the appropriate species?

      - id: NS.FIH.2
        requirement: required
        text: >-
          Has the genotoxicity battery (in vitro and in vivo as appropriate) been completed?

      - id: NS.FIH.3
        requirement: required
        text: >-
          Is a NOAEL established in each species, with safety margins relative to projected
          human exposure?

      - id: NS.FIH.4
        requirement: required
        text: >-
          Are dose-response relationships for toxicity characterized to inform the clinical
          starting dose and escalation?

      - id: NS.FIH.5
        requirement: required
        text: >-
          Is the FIH safe starting dose and Phase 1 dose range justified from NOAEL / MABEL
          and exposure margins?

      - id: NS.FIH.6
        requirement: required
        text: >-
          Are toxicokinetic data integrated with the tox studies to establish exposure at the
          NOAEL?

      - id: NS.FIH.7
        requirement: required
        text: >-
          Has safety pharmacology (CV/hERG, CNS, respiratory) been completed to support FIH?

      - id: NS.FIH.8
        requirement: required
        text: >-
          Are supporting bioanalytical methods qualified for tox species and human
          application?

      - id: NS.FIH.9
        requirement: required
        text: >-
          Do toxicology and toxicokinetic results support the doses and dosing duration
          anticipated for Phase 2, with a tox plan to support Phase 2?

      - id: NS.FIH.10
        requirement: required
        text: >-
          Is the Investigator's Brochure / Core Safety Information assembled from the
          toxicology studies for the IND?

  - id: ra
    label: Regulatory
    questions:
      - id: RA.FIH.1
        requirement: required
        text: >-
          Is the proposed regulatory path through the product life-cycle defined (clinical
          development, licensure, WHO PQ, post-authorization safety)?

      - id: RA.FIH.2
        requirement: required
        text: >-
          Is there a prioritized list of target countries with an understanding of country-
          specific regulatory requirements?

      - id: RA.FIH.3
        requirement: required
        text: >-
          Is there a plan for NRA engagement during development to gain agreement on
          development and filing strategy?

      - id: RA.FIH.4
        requirement: required
        text: >-
          Are key regulatory risks identified with mitigation plans?

      - id: RA.FIH.5
        requirement: required
        text: >-
          Does the plan ensure the proposed indication and labeling align with the TPP and
          donor/utilization requirements?

      - id: RA.FIH.6
        requirement: required
        text: >-
          Have alternative pathways (conditional, accelerated, breakthrough, Article 58,
          tropical voucher, orphan) been evaluated where relevant?

      - id: RA.FIH.7
        requirement: required
        text: >-
          Is WHO PQ applicability / programmatic suitability assessed, with a plan and
          engagement timeline (by end of Phase 2)?

      - id: RA.FIH.8
        requirement: required
        text: >-
          Is the pre-IND (or NRA-equivalent) briefing package prepared, with specific
          questions for the agency and supporting drug/nonclinical/clinical summaries?

      - id: RA.FIH.9
        requirement: required
        text: >-
          Is the ethics-committee review process and its interplay with the pre-IND/IND
          understood for the trial countries?

      - id: RA.FIH.10
        requirement: required
        text: >-
          Is the IND (or NRA clinical-trial) application prepared, submitted, and
          acknowledged, with a plan to address agency responses?
