# Lead Chemical Series Selection — the stage-gate question bank, transcribed.
#
# Transcribed by hand from the source named in `mirrors`, not parsed from it.
# That document is what this file was checked against; this file is the source
# everything downstream reads.
#
# The source guarantees three axes and this file carries exactly those three: the
# gate, the owning discipline, and whether the gate requires a question answered
# now (`required`) or expects it to be forming (`anticipatory`). Nothing else is
# transcribed and nothing is inferred — an earlier bank carried a hint about which
# document usually answers a question, which no source states, and it was removed.
#
# `intervention_classes` is a fact about the whole document rather than about any
# question: it derives from a drug milestone dictionary and asks about synthetic
# routes, salt and polymorph selection and BCS class, so a vaccine or a mAb has no
# answer to give. A run for another class is refused rather than returned with every
# question inapplicable, because a review of nothing reads like a review that found
# nothing wrong.

org: bmgf
gate:
  id: lcs
  label: Lead Chemical Series Selection
  ordinal: 1

intervention_classes: [drug]

mirrors: >-
  Stage Gate Questions - All Gates.docx, developed from the Drug Development Milestone
  Dictionary (PDID). LCS questions reviewed by the Certara team, 7/13.

disciplines:
  - id: pds
    label: Product Development Strategy
    questions:
      - id: PDS.LCS.1
        requirement: anticipatory
        text: >-
          Does the lead series align with the Foundation's disease strategy and the intended
          Intervention TPP (iTPP)?

      - id: PDS.LCS.2
        requirement: anticipatory
        text: >-
          Is there a clearly defined unmet need and use case that the product would address
          for the target population?

      - id: PDS.LCS.3
        requirement: anticipatory
        text: >-
          Does the series offer a credible improvement over the current standard of care? Is
          there a defensible basis for differentiation?

      - id: PDS.LCS.4
        requirement: anticipatory
        text: >-
          Is there a preliminary view of the full development pathway from LCS to
          registration? Or to FIH?

      - id: PDS.LCS.5
        requirement: anticipatory
        text: >-
          Are the early differentiating attributes (efficacy, safety, dosing, route) being
          optimized toward a profile that can realistically be delivered?

      - id: PDS.LCS.6
        requirement: anticipatory
        text: >-
          Is there an early view whether the series can meet an affordable target cost for the
          population?

      - id: PDS.LCS.7
        requirement: anticipatory
        text: >-
          Does the candidate series fit the portfolio strategy (complement vs. duplicate
          existing efforts/partnerships)?

      - id: PDS.LCS.8
        requirement: anticipatory
        text: >-
          Are key market and access assumptions (who pays, how delivered) being surfaced
          early?

      - id: PDS.LCS.9
        requirement: anticipatory
        text: >-
          Are strategic risks (deliverability, competition, funding) flagged in the lead-
          optimization plan?

      - id: PDS.LCS.10
        requirement: anticipatory
        text: >-
          Have internal capability gaps been assessed, and is there a clear plan to engage
          partner organizations where needed?

  - id: cmc
    label: Chemistry, Manufacturing and Controls (CMC)
    questions:
      - id: CMC.LCS.1
        requirement: required
        text: >-
          Have CMC screeners assessed the physicochemical properties (crystallinity,
          solubility/pKa, LogP/LogD, permeability, Lipinski) of the lead series, and do they
          support a developable, adequately bioavailable candidate?

      - id: CMC.LCS.2
        requirement: anticipatory
        text: >-
          Is the synthetic route feasible and scalable beyond bench quantities? Any cost,
          yield, hazardous-reagent, or step-count concerns that could block kilo-scale supply
          at PCD and later? Are any advanced intermediates with significant lead times
          required? Is OEB (occupational exposure band) known for the series and does it
          require specialized CDMOs for manufacture?

      - id: CMC.LCS.3
        requirement: anticipatory
        text: >-
          Has preliminary salt/solid-form thinking been done (crystalline vs. amorphous,
          polymorph risk, hygroscopicity risk), and does any series member show form-related
          developability red flags?

      - id: CMC.LCS.4
        requirement: anticipatory
        text: >-
          What is known about drug-substance stability (solid state, solution, and under
          T/pH/humidity/light), and are any chemical instability liabilities likely to limit
          formulation or shelf life?

      - id: CMC.LCS.5
        requirement: anticipatory
        text: >-
          Have impurity profiles and the feasibility of suitable analytical methods (identity,
          assay, purity) been evaluated across the series?

      - id: CMC.LCS.6
        requirement: anticipatory
        text: >-
          Does the anticipated formulation strategy and route of administration align with the
          target product profile, and is bioavailability achievable without complex enabling
          technology? Does the series exhibit suitable properties for meeting formulation
          requirements for alternate routes (e.g. parenteral, topical, intranasal) if needed?

      - id: CMC.LCS.7
        requirement: required
        text: >-
          Across the candidate series, which members rank highest on developability - and are
          we weighting CMC risk alongside potency and selectivity in the selection?

      - id: CMC.LCS.8
        requirement: anticipatory
        text: >-
          Are projected dose, presentation, and cost of goods consistent with the low-
          resource-setting TPP, or do they signal an unmanufacturable or unaffordable product?

      - id: CMC.LCS.9
        requirement: required
        text: >-
          Is a CMC development plan being initiated, with the activities and data defined to
          reach Initial DS/DP characterization by the PCD gate?

      - id: CMC.LCS.10
        requirement: required
        text: >-
          Have CMC partner needs (CMO/CRO capabilities, capacity, gaps) been identified, and
          are anticipated CMC risks captured with mitigations in the partner selection plan?

  - id: cp
    label: Clinical Pharmacology
    questions:
      - id: CP.LCS.1
        requirement: required
        text: >-
          Have target binding affinity, dose and/or concentration-response, and specificity
          been described using validated assays?

      - id: CP.LCS.2
        requirement: required
        text: >-
          Has a PK/PD relationship been established in vitro and/or in preclinical species? Is
          this relationship time dependent?

      - id: CP.LCS.3
        requirement: required
        text: >-
          Has free fraction and protein binding been characterized, and does the unbound
          exposure at the target site support the intended pharmacology?

      - id: CP.LCS.4
        requirement: required
        text: >-
          Have drug-drug interaction considerations (e.g., CYP/transporter liability) been
          factored into series selection?

      - id: CP.LCS.5
        requirement: required
        text: >-
          Does the lead-optimization strategy define the preclinical DMPK/PK parameters
          (clearance, half-life, volume of distribution) across at least 2 species?

      - id: CP.LCS.6
        requirement: anticipatory
        text: >-
          For phenotypic hits, is the mechanism of action defined, and is a target-engagement
          biomarker strategy emerging?

      - id: CP.LCS.7
        requirement: anticipatory
        text: >-
          Do preliminary ADME properties, including BCS classification, suggest the series can
          achieve the exposures the TPP implies, and are solubility and permeability
          limitations understood?

      - id: CP.LCS.8
        requirement: anticipatory
        text: >-
          Is there plan for predicting human PK from preclinical PK and an early view of the
          likely human dose range and route sufficient to judge developability?

      - id: CP.LCS.9
        requirement: anticipatory
        text: >-
          Are bioanalytical assay approaches feasible for the chemotype to support later PK/PD
          work?

      - id: CP.LCS.10
        requirement: anticipatory
        text: >-
          Are clin-pharm risks (narrow therapeutic index, high DDI potential, poor predicted
          exposure) captured in the lead-optimization plan?

  - id: ns
    label: Nonclinical Safety
    questions:
      - id: NS.LCS.1
        requirement: required
        text: >-
          Has off-target / secondary pharmacology screening been performed (e.g., Eurofins
          Safety Screening, cardiovascular ion channel, panels) to flag early safety
          liabilities?

      - id: NS.LCS.2
        requirement: required
        text: >-
          Has reactive-metabolite liability been assessed across the series?

      - id: NS.LCS.3
        requirement: required
        text: >-
          Has a rationale for nonclinical species selection been considered with supportive
          data (cross-species target homology, expression, binding affinity, metabolism)?

      - id: NS.LCS.4
        requirement: anticipatory
        text: >-
          Have early genotoxicity alerts (structural / in silico, e.g., Ames-predictive) been
          screened across the chemotype?

      - id: NS.LCS.5
        requirement: anticipatory
        text: >-
          Does the lead-optimization strategy include go/no-go safety criteria (selectivity
          windows, structural alerts)?

      - id: NS.LCS.6
        requirement: anticipatory
        text: >-
          Are potential on-target (mechanism-related) toxicity risks considered for the
          series?

      - id: NS.LCS.7
        requirement: anticipatory
        text: >-
          Is a preliminary safety-margin view (predicted efficacious vs. toxic exposure)
          emerging to guide selection?

      - id: NS.LCS.8
        requirement: anticipatory
        text: >-
          Are metabolite-related safety concerns (reactive / major metabolites) flagged for
          follow-up?

      - id: NS.LCS.9
        requirement: anticipatory
        text: >-
          Have phototoxicity, mutagenicity, or other structural-class liabilities relevant to
          the chemotype been considered?

      - id: NS.LCS.10
        requirement: anticipatory
        text: >-
          Are non-clinical-safety risks captured in the lead-optimization plan with screening
          to de-risk them?

  - id: ra
    label: Regulatory
    questions:
      - id: RA.LCS.1
        requirement: anticipatory
        text: >-
          Is the intended indication and likely regulatory approach (e.g., pathways for
          approval of a new chemical entity, or pathways allowing reliance on data from
          approved products with the same API) understood for the lead series?

      - id: RA.LCS.2
        requirement: anticipatory
        text: >-
          Are likely target markets / countries for introduction being considered to
          anticipate regulatory requirements?

      - id: RA.LCS.3
        requirement: anticipatory
        text: >-
          Is there awareness of relevant regulatory precedence for the target therapeutic area
          and/or product class that may help identify regulatory risks and/or potential areas
          for efficiencies in development?

      - id: RA.LCS.4
        requirement: anticipatory
        text: >-
          Has the potential applicability of expedited or special pathways (orphan, tropical-
          disease voucher, WHO PQ) been considered?

      - id: RA.LCS.5
        requirement: anticipatory
        text: >-
          Are potential chemical, class or mechanism-specific regulatory liabilities (class
          warnings, controlled-substance scheduling) flagged early?

      - id: RA.LCS.6
        requirement: anticipatory
        text: >-
          Is WHO PQ / programmatic-suitability potential being kept in view given the target
          population?

      - id: RA.LCS.7
        requirement: anticipatory
        text: >-
          Are IP / data-exclusivity considerations that affect regulatory strategy noted?

      - id: RA.LCS.8
        requirement: anticipatory
        text: >-
          Are questions being identified for which Regulatory input is needed and
          considerations being given to planning and timing for regulatory interactions to
          address these questions?

      - id: RA.LCS.9
        requirement: anticipatory
        text: >-
          Are regulatory risks captured in the lead-optimization plan for the candidate
          series?
