# Indications — shared vocabulary across services.
# Keyed by intervention_class. Each entry is the set of valid indication
# tags for that intervention. Read by:
#   - the header picker (drives the Indication dropdown)
#   - Inspector (labels the inspected document)
# Stamped on every output (block, claim, review result).

# Granularity standard for a tag:
#   - Name the disease target, and a syndrome only when leaving it out would
#     merge two distinct development programs. `hiv` needs no syndrome; Group B
#     Streptococcus does, because neonatal sepsis and adult GBS disease are
#     judged against different evidence.
#   - Never restate prevention or treatment. `intervention_class` carries it.
#   - Never name a population. Scout derives population from the document as a
#     cited semantic slot with an explicit unknown state, so a tag that also
#     encoded it would give one fact two owners that can disagree.
# Depth therefore varies by pathogen, and that is the intent: it tracks how many
# distinct programs share a pathogen, not a fixed number of words. That is a
# judgment, so it lives here rather than in a keyword check.
vaccine:
  - malaria
  - hiv
  - tb
  - rsv
  - influenza
  - covid19
  - dengue
  - cholera
  - hpv
  - pneumococcal_pneumonia
  - klebsiella_neonatal_sepsis
  - gbs_neonatal_sepsis

drug:
  - malaria
  - hiv
  - tb

diagnostic:
  - malaria
  - hiv
  - tb

device:
  - malaria
