# Indications — shared vocabulary across services.
# Keyed by intervention_class. Each entry is the set of valid indication
# tags for that intervention. Read by:
#   - the header picker (drives the Indication dropdown)
#   - Inspector (labels the inspected document)
# Stamped on every output (block, claim, review result).

# A tag is a stable key AND a search term, because it is stamped on every output and
# also substituted into retrieval prompts and joined into query text. Those two jobs
# used to conflict: the fallback de-underscored an attribute name beside an indication
# it left alone, so a multi-word name could only reach a query as one underscored
# token. That confined the vocabulary to single words — which is how the two names
# needing more than one became `tb` and `gbs`, the two worst search terms here.
#
# `shared.vocabulary.search_term` now de-underscores the tag once, upstream in Scout's
# pipeline, after blocks are stamped and before the tag becomes text. So a tag may be
# several words joined by underscores: store the key, and it reads correctly wherever
# it is used. Prefer the full name over an acronym unless the acronym is what a
# literature search actually uses — `hiv` and `hpv` qualify; `tb` and `gbs` did not.
#
# Nothing else belongs here, because every other axis already has an owner:
#   - prevention vs treatment -> intervention_class
#   - population, endpoint, measure, regimen -> the document, as cited semantic
#     slots with explicit unknown states
# `rsv` and `hpv` already follow this. An RSV program is infant prevention and
# an HPV program is cervical cancer prevention, and neither tag says so.
vaccine:
  - malaria
  - hiv
  - tuberculosis
  - rsv
  - influenza
  - covid19
  - dengue
  - cholera
  - hpv
  - pneumococcus
  - klebsiella
  # Not `gbs`: in a vaccine context that abbreviation is both Group B Streptococcus
  # and Guillain-Barre Syndrome, and the second is a classic vaccine adverse event of
  # special interest — so a safety search for `gbs` could return literature about the
  # wrong one entirely.
  - group_b_streptococcus
  - polio

drug:
  - malaria
  - hiv
  - tuberculosis

# A monoclonal antibody is assessed against the drug profile, so it offers the
# same indications. See services/inspector/configs/bmgf_*_mab.yaml.
mab:
  - malaria
  - hiv
  - tuberculosis

diagnostic:
  - malaria
  - hiv
  - tuberculosis

device:
  - malaria
