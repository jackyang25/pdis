# MeSH-aligned indication contexts, reviewed against the NLM 2026 descriptor release.
# Source: https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh/desc2026.gz
# Naming/maintenance rules and verification command: docs/indication-vocabulary.md.
#
# One list for every supported class. Context is not template support, portfolio
# membership, an approved use, or proof that an intervention exists for a disease.
# key is the ONLY runtime/display/search value. search_term derives its words;
# mesh.term is the cited NLM entry term, never an alternate runtime spelling.
# match=exact means that entry term belongs to the stated descriptor AND concept.
# match=narrower flags a local qualifier that MeSH does not represent exactly.
# Legacy keys are recognized only when validating existing corpus artifacts; they
# never appear as new choices, rewrite saved results, or expand search requests.
# In particular, never use gbs: it can also mean Guillain-Barre syndrome.
vaccine: &indication_contexts
