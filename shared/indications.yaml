# Indications — shared vocabulary across services.
# Keyed by intervention_class. Each entry is the set of valid indication
# tags for that intervention. Read by:
#   - the header picker (drives the Indication dropdown)
#   - Inspector (labels the inspected document)
# Stamped on every output (block, claim, review result).

# A tag travels verbatim. It is substituted into retrieval prompts, and the
# query_extractor fallback joins it straight into query text beside an attribute
# name that gets de-underscored while the indication does not. So a tag has to
# read as a search term rather than as a key: one lowercase word naming the
# pathogen or disease.
#
# Nothing else belongs here, because every other axis already has an owner:
#   - prevention vs treatment -> intervention_class
#   - population, endpoint, measure, regimen -> the document, as cited semantic
#     slots with explicit unknown states
# `rsv` and `hpv` already follow this. An RSV program is infant prevention and
# an HPV program is cervical cancer prevention, and neither tag says so.
vaccine:
  - malaria
  - hiv
  - tb
  - rsv
  - influenza
  - covid19
  - dengue
  - cholera
  - hpv
  - pneumococcus
  - klebsiella
  - gbs

drug:
  - malaria
  - hiv
  - tb

diagnostic:
  - malaria
  - hiv
  - tb

device:
  - malaria
